# Deploy to Self-Hosted Ubuntu | IP: 100.94.14.78
# The below workflow is the templated code of another project:
name: Deploy to Docker Swarm

on:
  push:
    branches: ['asiaconcierge'] # Adjust as needed
# ghcr.io/hungvutourchain/tourchain-net/hoteltourportal:asiaconcierge
env:
  RESISTRY: ghcr.io
  IMAGE_NAME: hungvutourchain/tourchain-net/reoprtportal:asiaconcierge
  SERVER_NAME: ${{secrets.SERVER_NAME}}
  BASE_API_URL: ${{secrets.BASE_API_URL}}
  CLIENT_API_URL: ${{secrets.SERVER_NAME}}${{secrets.BASE_API_URL}}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create .env
        run: |
          cat <<EOF > .env
          VITE_API_URL=${{ env.CLIENT_API_URL }}
          EOF
      #
      - name: Build frontend
        run: |
          npm install --legacy-peer-deps
          npm run build
          # Replace placeholder with actual server name
          sed -i "s/\${SERVER_NAME}/${{ env.SERVER_NAME }}/g" default.conf
          sed -i "s/\${BASE_API_URL}/${{ env.BASE_API_URL }}/g" default.conf
          cp default.conf dist/
          cp .env dist/

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    runs-on: [self-hosted, dellbuntu]
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Prepare nginx deploy path
        run: |
          sudo mkdir -p /var/www/vite_everything
          sudo chown -R cicd:cicd /var/www/vite_everything

      - name: Deploy frontend to nginx folder
        run: |
          sudo rm -rf /var/www/vite_everything/dist
          sudo cp -r dist /var/www/vite_everything/dist
          sudo cp -r dist/default.conf /etc/nginx/sites-available/vite_everything
          sudo ln -sf /etc/nginx/sites-available/vite_everything /etc/nginx/sites-enabled/
          sudo nginx -t
          sudo systemctl restart nginx
